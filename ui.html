<!doctype html>
<html><head><meta charset="utf-8"><style>
:root{color-scheme:light dark;font-family:Inter,system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;color:var(--figma-color-text);background:var(--figma-color-bg)}main{height:100vh;padding:20px;display:flex;flex-direction:column;gap:14px}h1{margin:0;font-size:22px}.eyebrow{margin:0 0 4px;color:var(--figma-color-text-secondary);font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}.muted{color:var(--figma-color-text-secondary);font-size:11px;line-height:1.4}.privacy{margin:10px 0 0;padding:9px 10px;border-radius:7px;background:var(--figma-color-bg-secondary);color:var(--figma-color-text-secondary);font-size:10px;line-height:1.4}.selection{padding:9px 10px;border:1px solid var(--figma-color-border);border-radius:7px;font-size:11px}.selection.valid{border-color:var(--figma-color-border-success)}label{display:grid;gap:6px;font-size:11px;font-weight:600}textarea,input{width:100%;padding:10px;color:var(--figma-color-text);background:var(--figma-color-bg-secondary);border:1px solid var(--figma-color-border);border-radius:6px;font:inherit;line-height:1.4}textarea{resize:none}textarea:focus,input:focus{outline:2px solid var(--figma-color-border-selected);outline-offset:-1px}button{height:38px;padding:0 14px;border:0;border-radius:6px;color:var(--figma-color-text-onbrand);background:var(--figma-color-bg-brand);font-weight:650;cursor:pointer}button:disabled{opacity:.45;cursor:default}.status{min-height:15px;color:var(--figma-color-text-secondary);font-size:11px}.error{color:var(--figma-color-text-danger)}#chat{display:none;min-height:0;flex:1;flex-direction:column;gap:12px;overflow:hidden}#chat.visible{display:flex}#messages{min-height:0;flex:1;overflow:auto;display:flex;flex-direction:column;gap:10px;padding-right:3px}.message{max-width:90%;padding:11px 12px;border-radius:10px;font-size:13px;line-height:1.45;white-space:pre-wrap}.boss{align-self:flex-start;background:var(--figma-color-bg-secondary)}.designer{align-self:flex-end;color:var(--figma-color-text-onbrand);background:var(--figma-color-bg-brand)}.speaker{display:block;margin-bottom:4px;font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.65}.reply{display:flex;gap:8px}.reply textarea{min-height:64px;flex:1}.reply button{align-self:flex-end}.ended{max-height:68%;overflow:auto;padding:14px;border:1px solid var(--figma-color-border);border-radius:10px;font-size:11px}.ended h2{margin:0 0 10px;font-size:22px}.ended table{width:100%;border-collapse:collapse}.ended th,.ended td{padding:6px 4px;border-bottom:1px solid var(--figma-color-border);text-align:left;vertical-align:top}.ended th{width:46%;font-weight:600}.ended .summary{margin:12px 0 5px;line-height:1.45}.ended .closing{margin:8px 0 0;color:var(--figma-color-text-secondary);font-style:italic;line-height:1.4}
.artifact-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.artifact-actions button{height:34px;font-size:11px}.artifact-actions .secondary,#mockReport{color:var(--figma-color-text);background:var(--figma-color-bg-secondary);border:1px solid var(--figma-color-border)}
</style></head><body><main>
<header><p class="eyebrow">Your Boss Has Thoughts</p><h1>Survive the review.</h1></header>
<section id="setup">
  <div id="selection" class="selection">Select exactly one frame.</div>
  <label style="margin-top:14px">Private tester access code<input id="testerCode" type="password" autocomplete="off" placeholder="Provided with your test invitation"></label>
  <label style="margin-top:14px">What is this design trying to do?<textarea id="intent" rows="5" placeholder="Help first-time users understand the value and start a free trial without feeling pressured."></textarea></label>
  <p class="privacy">Your selected frame is sent once for this meeting. The test does not save the frame or conversation. Closing the plugin clears the session.</p>
  <button id="start" style="width:100%;margin-top:12px" disabled>Bring in the Boss</button>
  <button id="mockReport" class="secondary" style="display:none;width:100%;margin-top:8px">Local: Mock Survived Report</button>
</section>
<section id="chat"><div id="messages"></div><div id="ended" class="ended" hidden></div><div id="reply" class="reply"><textarea id="designerReply" placeholder="Defend it. Concede. Ask a question. Admit you don't know."></textarea><button id="send" disabled>Respond</button></div></section>
<div id="status" class="status" aria-live="polite"></div>
</main><script>
const API_URL="http://localhost:8787/meeting";const $=(id)=>document.getElementById(id);const selection=$("selection"),testerCode=$("testerCode"),intent=$("intent"),start=$("start"),mockReport=$("mockReport"),setup=$("setup"),chat=$("chat"),messages=$("messages"),reply=$("reply"),designerReply=$("designerReply"),send=$("send"),status=$("status"),ended=$("ended");let validSelection=false,busy=false,session=null,history=[];
if(API_URL.startsWith("http://localhost:"))mockReport.style.display="block";
function refresh(){start.disabled=busy||!validSelection||!intent.value.trim();send.disabled=busy||!designerReply.value.trim()||!session||session.ended}intent.addEventListener("input",refresh);designerReply.addEventListener("input",refresh);
function setBusy(value,text=""){busy=value;status.className="status";status.textContent=text;refresh()}function showError(error){busy=false;status.className="status error";status.textContent=error instanceof Error?error.message:String(error);refresh()}
function addMessage(role,text){const node=document.createElement("div");node.className=`message ${role}`;const speaker=document.createElement("span");speaker.className="speaker";speaker.textContent=role==="boss"?"Boss":"You";node.append(speaker,document.createTextNode(text));messages.append(node);messages.scrollTop=messages.scrollHeight;history.push({role,text})}
function reportRows(meeting){const first=meeting.initialState,current=meeting.state,report=meeting.report;return [["EgoMeter™",`${first.egoMeter} → ${current.egoMeter}`],["Bullshit Detector™",`${first.bullshitDetector} → ${current.bullshitDetector}`],["Design Integrity",`${current.designIntegrity}%`],["Stakeholder Confidence",`${current.stakeholderConfidence}%`],["Decision Quality",`${first.decisionQuality} → ${current.decisionQuality}`],["Outcome",report.outcome||meeting.outcome],["Design changed",report.designChanged],["Thinking changed",report.thinkingChanged],["Momentum preserved",report.momentumPreserved],["Boss contribution",report.bossContribution],["Unresolved concern",report.unresolvedConcern]]}
function renderReport(meeting){const report=meeting.report;ended.replaceChildren();const title=document.createElement("h2");title.textContent=report.survived?"SURVIVED":"MEETING LOST";const table=document.createElement("table");for(const[label,value]of reportRows(meeting)){const row=document.createElement("tr"),heading=document.createElement("th"),cell=document.createElement("td");heading.textContent=label;cell.textContent=value;row.append(heading,cell);table.append(row)}const summary=document.createElement("p");summary.className="summary";summary.textContent=report.summary;const closing=document.createElement("p");closing.className="closing";closing.textContent=report.closingLine;const actions=document.createElement("div");actions.className="artifact-actions";const copy=document.createElement("button");copy.className="secondary";copy.textContent="Copy PNG";copy.addEventListener("click",copyReportPng);const place=document.createElement("button");place.textContent="Place in Figma";place.addEventListener("click",placeReportInFigma);actions.append(copy,place);ended.append(title,table,summary,closing,actions);ended.hidden=false}
function wrapCanvasText(context,text,maxWidth){const words=String(text??"").split(/\s+/),lines=[];let line="";for(const word of words){const test=line?`${line} ${word}`:word;if(context.measureText(test).width>maxWidth&&line){lines.push(line);line=word}else line=test}if(line)lines.push(line);return lines}
function drawWrapped(context,text,x,y,maxWidth,lineHeight){const lines=wrapCanvasText(context,text,maxWidth);for(const line of lines){context.fillText(line,x,y);y+=lineHeight}return y}
async function createReportPng(){
  if(!session||!session.ended)throw new Error("Finish the meeting before saving the report.");
  const width=1200,padding=84,labelWidth=340,valueWidth=width-padding*2-labelWidth,rows=reportRows(session),canvas=document.createElement("canvas"),measure=canvas.getContext("2d");
  canvas.width=width;
  measure.font="30px Inter, Arial, sans-serif";
  let height=390;
  for(const[,value]of rows)height+=Math.max(68,wrapCanvasText(measure,value,valueWidth).length*40+28);
  measure.font="32px Inter, Arial, sans-serif";
  height+=wrapCanvasText(measure,session.report.summary,width-padding*2).length*46;
  measure.font="italic 30px Inter, Arial, sans-serif";
  height+=wrapCanvasText(measure,session.report.closingLine,width-padding*2).length*44+190;
  canvas.height=height;
  const context=canvas.getContext("2d");
  context.fillStyle="#F4F0E8";context.fillRect(0,0,width,height);
  context.fillStyle="#171717";context.font="700 24px Inter, Arial, sans-serif";context.fillText("YOUR BOSS HAS THOUGHTS",padding,82);
  context.font="800 100px Inter, Arial, sans-serif";context.fillText(session.report.survived?"SURVIVED":"MEETING LOST",padding,205);
  context.font="28px Inter, Arial, sans-serif";context.fillStyle="#66615A";context.fillText("POST-MEETING REPORT",padding,260);
  let y=330;
  for(const[label,value]of rows){
    context.font="30px Inter, Arial, sans-serif";
    const valueLines=wrapCanvasText(context,value,valueWidth),rowHeight=Math.max(68,valueLines.length*40+28);
    context.strokeStyle="#CFC8BD";context.beginPath();context.moveTo(padding,y);context.lineTo(width-padding,y);context.stroke();
    context.font="700 25px Inter, Arial, sans-serif";context.fillStyle="#171717";context.fillText(label,padding,y+43);
    context.font="30px Inter, Arial, sans-serif";
    let valueY=y+42;for(const line of valueLines){context.fillText(line,padding+labelWidth,valueY);valueY+=40}
    y+=rowHeight;
  }
  context.strokeStyle="#CFC8BD";context.beginPath();context.moveTo(padding,y);context.lineTo(width-padding,y);context.stroke();
  y+=70;context.font="700 24px Inter, Arial, sans-serif";context.fillStyle="#66615A";context.fillText("WHAT ACTUALLY HAPPENED",padding,y);
  y+=52;context.font="32px Inter, Arial, sans-serif";context.fillStyle="#171717";y=drawWrapped(context,session.report.summary,padding,y,width-padding*2,46);
  y+=48;context.font="italic 30px Inter, Arial, sans-serif";context.fillStyle="#66615A";drawWrapped(context,session.report.closingLine,padding,y,width-padding*2,44);
  const blob=await new Promise((resolve,reject)=>canvas.toBlob(value=>value?resolve(value):reject(new Error("The PNG could not be created.")),"image/png"));
  return {blob,width,height};
}
async function copyReportPng(){setBusy(true,"Making your PNG…");try{const{blob}=await createReportPng();if(!navigator.clipboard||typeof ClipboardItem==="undefined")throw new Error("Image copy is not available here. Use Place in Figma instead.");await navigator.clipboard.write([new ClipboardItem({"image/png":blob})]);setBusy(false,"PNG copied. Paste it wherever you need it.")}catch(error){showError(error)}}
async function placeReportInFigma(){setBusy(true,"Placing the report beside your frame…");try{const{blob,width,height}=await createReportPng();const imageBytes=new Uint8Array(await blob.arrayBuffer());parent.postMessage({pluginMessage:{type:"place-report",imageBytes,width,height,outcome:session.report.survived?"SURVIVED":"MEETING LOST"}},"*")}catch(error){showError(error)}}
function bytesToBase64(bytes){let binary="",chunk=0x8000;for(let i=0;i<bytes.length;i+=chunk)binary+=String.fromCharCode(...bytes.subarray(i,i+chunk));return btoa(binary)}
async function request(payload){const response=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"application/json","X-Tester-Code":testerCode.value.trim()},body:JSON.stringify(payload)});const body=await response.json();if(!response.ok)throw new Error(body.error||"The boss is unavailable.");return body}
start.addEventListener("click",()=>{setBusy(true,"Looking at the frame…");parent.postMessage({pluginMessage:{type:"analyze",intent:intent.value}},"*")});
mockReport.addEventListener("click",()=>{session={ended:true,outcome:"A clearer next step without turning the whole thing into a redesign.",initialState:{egoMeter:74,bullshitDetector:63,designIntegrity:82,stakeholderConfidence:46,decisionQuality:51,chaos:38},state:{egoMeter:48,bullshitDetector:29,designIntegrity:76,stakeholderConfidence:81,decisionQuality:84,chaos:31},report:{survived:true,outcome:"The design moves forward with one focused test.",designChanged:"The value statement gets sharper; the core structure survives.",thinkingChanged:"The designer separated a real concern from the boss's terrible solution.",momentumPreserved:"Yes — one small revision and a test, not a committee redesign.",bossContribution:"Correctly noticed that the value was not obvious quickly enough.",unresolvedConcern:"The boss still wants the logo bigger, for reasons nobody can explain.",summary:"The boss arrived with a vague feeling and an oversized solution. The designer found the useful concern underneath it, admitted what was not yet proven, and proposed a cheap way to learn. Nobody got everything they wanted, which is usually how you know the meeting worked.",closingLine:"You survived. The logo remains under observation."}};setup.hidden=true;chat.classList.add("visible");messages.replaceChildren();reply.hidden=true;renderReport(session);setBusy(false,"Local mock — no API call was made.")});
send.addEventListener("click",async()=>{const text=designerReply.value.trim();if(!text)return;const priorHistory=history.slice();addMessage("designer",text);designerReply.value="";setBusy(true,"The boss is thinking…");try{session=await request({phase:"respond",intent:intent.value,session,history:priorHistory,designerResponse:text});addMessage("boss",session.bossResponse);if(session.ended){reply.hidden=true;renderReport(session)}}catch(error){showError(error);return}setBusy(false)});
designerReply.addEventListener("keydown",(event)=>{if(event.key==="Enter"&&(event.metaKey||event.ctrlKey)){event.preventDefault();send.click()}});
onmessage=async({data})=>{const message=data.pluginMessage;if(!message)return;if(message.type==="selection"){validSelection=message.valid;selection.textContent=message.valid?`Selected: ${message.name}`:"Select exactly one frame.";selection.classList.toggle("valid",message.valid);refresh()}if(message.type==="exporting")status.textContent="Looking at the frame…";if(message.type==="frame-export"){setBusy(true,"The boss is forming an opinion…");try{session=await request({phase:"start",frameName:message.frameName,intent:message.intent,imageBase64:bytesToBase64(message.imageBytes)});setup.hidden=true;chat.classList.add("visible");addMessage("boss",session.bossResponse);designerReply.focus()}catch(error){showError(error);return}setBusy(false)}if(message.type==="report-placed")setBusy(false,"Report placed beside the reviewed frame.");if(message.type==="error")showError(message.message)};
</script></body></html>
